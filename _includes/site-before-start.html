<script>
  /* Applique le thème sombre avant l'affichage de la page (évite le flash blanc). */
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {}
  })();
</script>

<style>
/* ---------- Images ---------- */
.post-content img, article img, p img, td img {
  max-width: 85% !important;
  height: auto !important;
  margin: 25px auto !important;
  display: block !important;
}

#leaf-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 900;
}
.leaf {
  position: absolute;
  top: -40px;
  line-height: 1;
  user-select: none;
  will-change: transform, opacity;
  animation-name: leaf-fall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}
@keyframes leaf-fall {
  0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
  10%  { opacity: var(--op, 0.7); }
  25%  { transform: translate3d(var(--drift), 25vh, 0) rotate(calc(var(--spin) * 0.25)); }
  50%  { transform: translate3d(calc(var(--drift) * -0.5), 55vh, 0) rotate(calc(var(--spin) * 0.5)); }
  75%  { transform: translate3d(var(--drift), 85vh, 0) rotate(calc(var(--spin) * 0.75)); opacity: var(--op, 0.7); }
  100% { transform: translate3d(0, 112vh, 0) rotate(var(--spin)); opacity: 0; }
}

/* ---------- Bouton clair / sombre ---------- */
#theme-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  border-radius: 50px;
  border: 1px solid #ccc;
  background-color: #fff;
  color: #333;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  font-family: sans-serif;
  font-size: 14px;
  z-index: 1000;
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}
#theme-toggle:focus-visible {
  outline: 3px solid #58a6ff;
  outline-offset: 2px;
}

/* ---------- Mode sombre ---------- */
html.dark-mode {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --text: #c9d1d9;
  --border: #30363d;
  --link: #58a6ff;
  color-scheme: dark;
}
html.dark-mode,
html.dark-mode body,
html.dark-mode header,
html.dark-mode footer,
html.dark-mode main,
html.dark-mode nav,
html.dark-mode aside,
html.dark-mode article,
html.dark-mode section {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}
html.dark-mode h1, html.dark-mode h2, html.dark-mode h3,
html.dark-mode h4, html.dark-mode h5, html.dark-mode h6,
html.dark-mode p, html.dark-mode li, html.dark-mode td,

</style>
