<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <!-- Chargement du CSS du thème et de votre CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- SCRIPT INJECTÉ DANS LE HEAD POUR EVITER LE CHEVAUCHEMENT (ANTI-FLASH) -->
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>

  <style>
    /* APPLICATION IMMEDIATE DU MODE SOMBRE AU CHARGEMENT SUR LE DOCUMENT EXTRÊME */
    html.dark-mode body, html.dark-mode {
      background-color: #1a1a1a !important; /* Force votre couleur sombre de fond */
      color: #f5f5f5 !important;
    }

    /* REDIMENSIONNEMENT DES IMAGES (EVITE LE ZOOM GÉANT) */
    .post-content img, main img {
      max-width: 75% !important;
      height: auto !important;
      display: block !important;
      margin: 35px auto !important; /* Espacement propre entre le texte et l'image */
      border-radius: 6px;
    }

    /* ESPACEMENT ET LECTURE DU TEXTE */
    .post-content p, main p {
      margin-bottom: 1.6rem !important;
      line-height: 1.6 !important;
    }

    /* ANIMATION DES FEUILLES */
    .leaf-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 9999;
    }

    .leaf {
      position: absolute;
      top: -50px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(50px);
        opacity: 0.3;
      }
    }
  </style>
</head>
<body>

  <!-- CONTENEUR DES FEUILLES -->
  <div class="leaf-container" id="leaf-container"></div>

  <!-- BOUTON DE CHANGEMENT DE THÈME -->
  <div style="max-width: 750px; margin: 0 auto; padding: 15px 20px; text-align: right;">
    <button id="theme-toggle" style="padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: transparent; color: inherit;">🌙 Mode Sombre</button>
  </div>

  <!-- CONTENEUR PRINCIPAL DE VOTRE SITE (CADRE STRUCTURÉ SANS ACCENTUATION DU ZOOM) -->
  <main class="container" style="max-width: 720px; margin: 0 auto; padding: 0 20px;">
    <article class="post">
      <header class="post-header" style="margin-bottom: 30px;">
        <h1 class="post-title" style="font-size: 2.2rem; margin-top: 10px;">{{ page.title }}</h1>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>

  <!-- LE SCRIPT LOGIQUE DES ACTIONS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('theme-toggle');
      const htmlEl = document.documentElement;
      const bodyEl = document.body;

      // On synchronise le bouton et le body selon l'état actuel de l'élément racine
      if (htmlEl.classList.contains('dark-mode')) {
        bodyEl.classList.add('dark-mode');
        if (toggleBtn) toggleBtn.textContent = '☀️ Mode Clair';
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          htmlEl.classList.toggle('dark-mode');
          bodyEl.classList.toggle('dark-mode');
          
          if (htmlEl.classList.contains('dark-mode')) {
            toggleBtn.textContent = '☀️ Mode Clair';
            localStorage.setItem('theme', 'dark');
          } else {
            toggleBtn.textContent = '🌙 Mode Sombre';
            localStorage.setItem('theme', 'light');
          }
        });
      }

      // ANIMATION DES FEUILLES
      const container = document.getElementById('leaf-container');
      const leaves = ['🍁', '🍂', '🍃', '🌱']; 

      function createLeaf() {
        const leaf = document.createElement('div');
        leaf.classList.add('leaf');
        leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
        leaf.style.left = Math.random() * 100 + 'vw';
        const duration = Math.random() * 5 + 5;
        leaf.style.animationDuration = duration + 's';
        leaf.style.fontSize = Math.random() * 12 + 15 + 'px';
        leaf.style.opacity = Math.random() * 0.6 + 0.3;

        container.appendChild(leaf);

        setTimeout(() => {
          leaf.remove();
        }, duration * 1000);
      }

      setInterval(createLeaf, 450);
    });
  </script>
</body>
</html>
