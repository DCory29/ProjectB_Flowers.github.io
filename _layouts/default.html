layout: page
---

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<div style="max-width: 800px; margin: 0 auto; padding: 10px 20px; text-align: right;">
  <button id="theme-toggle" style="padding: 5px 10px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: transparent; color: inherit;">🌙 Mode Sombre</button>
</div>

{{ content }}

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    if (!toggleBtn) return;

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      toggleBtn.textContent = '☀️ Mode Clair';
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        toggleBtn.textContent = '☀️ Mode Clair';
        localStorage.setItem('theme', 'dark');
      } else {
        toggleBtn.textContent = '🌙 Mode Sombre';
        localStorage.setItem('theme', 'light');
      }
    });
  });
</script>
