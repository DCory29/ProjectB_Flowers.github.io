<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <!-- Chargement du CSS du thème Alembic -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <!-- Chargement de VOTRE CSS personnalisé pour le mode sombre -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Bouton global du mode sombre (il s'affichera automatiquement sur CHAQUE page) -->
  <div style="text-align: right; padding: 10px;">
    <button id="theme-toggle">🌙 Mode Sombre</button>
  </div>

  <main>
    {{ content }}
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('theme-toggle');
      const body = document.body;

      if (!toggleBtn) return;

      // 1. Appliquer le mode sauvegardé immédiatement
      if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️ Mode Clair';
      }

      // 2. Gérer le clic
      toggleBtn.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        if (body.classList.contains('dark-mode')) {
          toggleBtn.textContent = '☀️ Mode Clair';
          localStorage.setItem('theme', 'dark');
        } else {
          toggleBtn.textContent = '🌙 Mode Sombre';
          localStorage.setItem('theme', 'light');
        }
      });
    });
  </script>
</body>
</html>
